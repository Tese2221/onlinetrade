<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="b3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="380" rx="24" fill="url(#b3Bg)"/>
  <circle cx="710" cy="190" r="230" fill="url(#cyanGlow)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect width="190" height="34" rx="17" fill="#0d9488"/>
    <text x="95" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PAYMENT CHANNELS</text>

    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Instant Bank Deposit
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#5eead4" letter-spacing="-0.5">
      &amp; Fast Withdrawals
    </text>

    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#ccfbf1">
      Official support for CBE, Telebirr, Awash Bank &amp; Bank of Abyssinia.
    </text>

    <g transform="translate(0, 215)">
      <rect width="180" height="46" rx="23" fill="#14b8a6"/>
      <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Deposit Balance →
      </text>
    </g>
  </g>

  <!-- Right Visual: Bank Logos Grid Cards -->
  <g transform="translate(560, 85)">
    <!-- CBE Card -->
    <g transform="translate(0, 0)">
      <rect width="145" height="95" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
      <circle cx="72" cy="40" r="22" fill="#800080"/>
      <text x="72" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffd700" text-anchor="middle">CBE</text>
      <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Commercial Bank</text>
    </g>

    <!-- Telebirr Card -->
    <g transform="translate(160, 0)">
      <rect width="145" height="95" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
      <circle cx="72" cy="40" r="22" fill="#0072ce"/>
      <text x="72" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">telebirr</text>
      <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Mobile Money</text>
    </g>

    <!-- Awash Card -->
    <g transform="translate(0, 115)">
      <rect width="145" height="95" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
      <circle cx="72" cy="40" r="22" fill="#15803d"/>
      <text x="72" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffd700" text-anchor="middle">AWASH</text>
      <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Awash Bank</text>
    </g>

    <!-- Abyssinia Card -->
    <g transform="translate(160, 115)">
      <rect width="145" height="95" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
      <circle cx="72" cy="40" r="22" fill="#d97706"/>
      <text x="72" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">BOA</text>
      <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Bank of Abyssinia</text>
    </g>
  </g>
</svg>
