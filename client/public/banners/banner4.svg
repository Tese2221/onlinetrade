<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="b4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="380" rx="24" fill="url(#b4Bg)"/>
  <circle cx="700" cy="190" r="230" fill="url(#indigoGlow)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="17" fill="#6366f1"/>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DAILY ACCRUAL</text>

    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Daily Harvest Tasks
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#c7d2fe" letter-spacing="-0.5">
      Claim In 1-Click Every 24h
    </text>

    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#e0e7ff">
      Automatic daily yields credited straight to your available balance.
    </text>

    <g transform="translate(0, 215)">
      <rect width="180" height="46" rx="23" fill="#818cf8"/>
      <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        View Tasks →
      </text>
    </g>
  </g>

  <!-- Right Visual: Daily Accrual Calendar & Checkmark Clock -->
  <g transform="translate(680, 190)">
    <ellipse cx="0" cy="115" rx="130" ry="22" fill="#000000" opacity="0.3"/>

    <!-- Clock / Timer circle -->
    <circle cx="0" cy="0" r="95" fill="#4f46e5" stroke="#a5b4fc" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="#3730a3"/>

    <!-- Checkmark -->
    <path d="M -30 0 L -10 25 L 35 -25" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 24h Badge floating -->
    <g transform="translate(45, -60)">
      <rect width="70" height="34" rx="17" fill="#fbbf24"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#78350f" text-anchor="middle">24H</text>
    </g>
  </g>
</svg>
