<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="b2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="380" rx="24" fill="url(#b2Bg)"/>
  <circle cx="700" cy="190" r="240" fill="url(#goldGlow)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="17" fill="#10b981"/>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NEW REGISTRATION</text>

    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Get Free ETB 100
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#fbbf24" letter-spacing="-0.5">
      Welcome Bonus
    </text>

    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#d1fae5">
      Instant credit upon joining. Min deposit 300 ETB · Min withdraw 150 ETB.
    </text>

    <g transform="translate(0, 215)">
      <rect width="180" height="46" rx="23" fill="#fbbf24"/>
      <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#78350f" text-anchor="middle">
        Claim Bonus Now →
      </text>
    </g>
  </g>

  <!-- Right Visual: Big 100 ETB Coin & Gift Box -->
  <g transform="translate(710, 190)">
    <ellipse cx="0" cy="115" rx="140" ry="24" fill="#000000" opacity="0.3"/>

    <!-- Golden Coin -->
    <circle cx="20" cy="-20" r="85" fill="#f59e0b" stroke="#fef08a" stroke-width="6"/>
    <circle cx="20" cy="-20" r="70" fill="#d97706"/>
    <text x="20" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">100</text>
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#fef08a" text-anchor="middle">ETB</text>

    <!-- Gift Box Front -->
    <g transform="translate(-70, 20)">
      <rect x="0" y="0" width="100" height="90" rx="8" fill="#ef4444"/>
      <rect x="0" y="-15" width="110" height="20" rx="4" transform="translate(-5, 0)" fill="#dc2626"/>
      <!-- Gold Ribbons -->
      <rect x="42" y="0" width="16" height="90" fill="#fbbf24"/>
      <rect x="37" y="-15" width="26" height="20" fill="#f59e0b"/>
      <!-- Bow -->
      <path d="M 50 -15 C 30 -40 10 -30 35 -18 Z" fill="#fbbf24"/>
      <path d="M 50 -15 C 70 -40 90 -30 65 -18 Z" fill="#fbbf24"/>
      <circle cx="50" cy="-15" r="7" fill="#f59e0b"/>
    </g>
  </g>
</svg>
