<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="b1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="24" fill="url(#b1Bg)"/>
  <circle cx="750" cy="140" r="260" fill="url(#sunGlow)"/>

  <!-- Left Copy -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect width="180" height="34" rx="17" fill="url(#goldPill)"/>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle" letter-spacing="0.5">FRUIT AGRI-TRADE</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Invest in Fresh Fruits
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#a7f3d0" letter-spacing="-0.5">
      Earn 5% Daily Income
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#d1fae5">
      Backed by verified fruit trader network &amp; daily market harvests.
    </text>

    <!-- CTA Button Mock -->
    <g transform="translate(0, 215)">
      <rect width="170" height="46" rx="23" fill="#ffffff"/>
      <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">
        Start Trading →
      </text>
    </g>
  </g>

  <!-- Right Visual Graphics: Fresh Fruit Cluster -->
  <g transform="translate(680, 190)">
    <!-- Soft shadow -->
    <ellipse cx="0" cy="110" rx="150" ry="25" fill="#000000" opacity="0.25"/>

    <!-- Pineapple -->
    <g transform="translate(30, -50) scale(0.65)">
      <ellipse cx="0" cy="30" rx="70" ry="90" fill="#f59e0b"/>
      <path d="M 0 -60 C -15 -100 -40 -130 -60 -150 C -35 -120 -10 -90 0 -60 Z" fill="#15803d"/>
      <path d="M 0 -60 C 15 -100 40 -130 60 -150 C 35 -120 10 -90 0 -60 Z" fill="#15803d"/>
      <path d="M 0 -60 C 0 -110 0 -140 0 -160 C 0 -140 0 -110 0 -60 Z" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Red Apple -->
    <g transform="translate(-60, 10) scale(0.7)">
      <circle cx="0" cy="0" r="70" fill="#ef4444"/>
      <path d="M 0 -70 C 10 -90 25 -100 35 -105 C 30 -90 20 -75 5 -65 Z" fill="#78350f"/>
      <path d="M 5 -75 C 30 -95 65 -90 70 -75 C 60 -55 30 -60 5 -75 Z" fill="#22c55e"/>
      <ellipse cx="-25" cy="-25" rx="18" ry="10" transform="rotate(-30 -25 -25)" fill="#ffffff" opacity="0.35"/>
    </g>

    <!-- Mango -->
    <g transform="translate(45, 30) scale(0.68)">
      <ellipse cx="0" cy="0" rx="65" ry="55" transform="rotate(-20 0 0)" fill="#f97316"/>
      <ellipse cx="-15" cy="-15" rx="20" ry="10" transform="rotate(-40 -15 -15)" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Growth Graph Curve Floating -->
    <g transform="translate(-160, -80)">
      <path d="M 0 60 L 60 40 L 120 70 L 180 20 L 240 0" stroke="#fef08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="0" cy="60" r="7" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="60" cy="40" r="7" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="120" cy="70" r="7" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="180" cy="20" r="7" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="240" cy="0" r="9" fill="#fef08a" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>
</svg>
