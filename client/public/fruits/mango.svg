<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mangoGlow" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="90%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <linearGradient id="mangoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="mangoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="mangoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#mangoBg)"/>
  <circle cx="200" cy="205" r="145" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="200" cy="335" rx="100" ry="22" fill="#000000" opacity="0.12"/>

  <g filter="url(#mangoShadow)">
    <!-- Leaves & Stem -->
    <path d="M 180 115 C 160 80 120 75 100 85 C 115 110 150 125 180 115 Z" fill="url(#mangoLeaf)"/>
    <path d="M 180 115 C 205 75 255 70 280 80 C 265 110 225 125 180 115 Z" fill="url(#mangoLeaf)"/>
    <path d="M 180 120 L 185 95" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>

    <!-- Tropical Mango Shape (Kidney bean curve) -->
    <path d="M 180 115 
             C 240 115 295 160 300 230 
             C 305 295 245 330 195 330 
             C 145 330 100 290 105 210 
             C 108 150 145 115 180 115 Z" 
          fill="url(#mangoGlow)"/>

    <!-- Natural Gloss & Highlights -->
    <path d="M 140 155 C 125 185 125 240 145 270 C 135 240 135 185 155 160 C 158 150 148 145 140 155 Z" 
          fill="#ffffff" opacity="0.38"/>
    <ellipse cx="170" cy="155" rx="20" ry="35" transform="rotate(-35 170 155)" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
