<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avoFlesh" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#d9f99d"/>
      <stop offset="75%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </radialGradient>
    <radialGradient id="avoPit" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="35%" stop-color="#854d0e"/>
      <stop offset="75%" stop-color="#542805"/>
      <stop offset="100%" stop-color="#2e1402"/>
    </radialGradient>
    <linearGradient id="avoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="avoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
    <filter id="avoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14532d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#avoBg)"/>
  <circle cx="200" cy="210" r="145" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="200" cy="340" rx="95" ry="20" fill="#000000" opacity="0.12"/>

  <g filter="url(#avoShadow)">
    <!-- Dark Skin Border Outer -->
    <path d="M 200 115 
             C 245 115 285 155 285 200 
             C 285 220 305 250 300 285 
             C 290 335 245 350 200 350 
             C 155 350 110 335 100 285 
             C 95 250 115 220 115 200 
             C 115 155 155 115 200 115 Z" 
          fill="url(#avoSkin)"/>

    <!-- Creamy Flesh Inner -->
    <path d="M 200 125 
             C 238 125 272 160 272 200 
             C 272 220 292 250 288 280 
             C 280 325 240 338 200 338 
             C 160 338 120 325 112 280 
             C 108 250 128 220 128 200 
             C 128 160 162 125 200 125 Z" 
          fill="url(#avoFlesh)"/>

    <!-- Seed Pit Depression & Ball -->
    <circle cx="200" cy="265" r="50" fill="#3f6212" opacity="0.4"/>
    <circle cx="200" cy="262" r="48" fill="url(#avoPit)"/>

    <!-- Pit Gloss / Shine -->
    <ellipse cx="185" cy="245" rx="14" ry="8" transform="rotate(-30 185 245)" fill="#ffffff" opacity="0.45"/>

    <!-- Stem on Top -->
    <path d="M 200 115 L 200 95" stroke="#713f12" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
