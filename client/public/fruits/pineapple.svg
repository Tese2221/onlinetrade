<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pineGlow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <linearGradient id="pineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pineLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="pineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#pineBg)"/>
  <circle cx="200" cy="210" r="145" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="200" cy="350" rx="90" ry="20" fill="#000000" opacity="0.12"/>

  <g filter="url(#pineShadow)">
    <!-- Spiky Crown Leaves (Behind) -->
    <path d="M 200 160 C 180 120 140 70 110 50 C 135 90 170 130 190 160 Z" fill="url(#pineLeaf)"/>
    <path d="M 200 160 C 220 120 260 70 290 50 C 265 90 230 130 210 160 Z" fill="url(#pineLeaf)"/>
    <path d="M 200 160 C 195 100 190 50 200 35 C 210 50 205 100 200 160 Z" fill="url(#pineLeaf)"/>
    <path d="M 200 160 C 175 120 130 90 90 85 C 120 115 160 140 190 165 Z" fill="url(#pineLeaf)"/>
    <path d="M 200 160 C 225 120 270 90 310 85 C 280 115 240 140 210 165 Z" fill="url(#pineLeaf)"/>

    <!-- Pineapple Oval Body -->
    <ellipse cx="200" cy="250" rx="85" ry="100" fill="url(#pineGlow)"/>

    <!-- Diamond Texture Cross-Hatching -->
    <g stroke="#78350f" stroke-width="2.5" opacity="0.45" fill="none">
      <path d="M 130 200 Q 200 240 270 290"/>
      <path d="M 120 230 Q 200 270 275 320"/>
      <path d="M 125 170 Q 200 210 265 260"/>
      <path d="M 140 270 Q 200 300 250 340"/>

      <path d="M 270 200 Q 200 240 130 290"/>
      <path d="M 280 230 Q 200 270 125 320"/>
      <path d="M 275 170 Q 200 210 135 260"/>
      <path d="M 260 270 Q 200 300 150 340"/>
    </g>

    <!-- Diamond Centers (Golden dots) -->
    <g fill="#fef08a" opacity="0.6">
      <circle cx="200" cy="240" r="4"/>
      <circle cx="165" cy="220" r="4"/>
      <circle cx="235" cy="220" r="4"/>
      <circle cx="200" cy="275" r="4"/>
      <circle cx="165" cy="260" r="4"/>
      <circle cx="235" cy="260" r="4"/>
      <circle cx="170" cy="295" r="4"/>
      <circle cx="230" cy="295" r="4"/>
      <circle cx="200" cy="315" r="4"/>
    </g>

    <!-- Glossy Highlight on side -->
    <path d="M 135 210 C 120 240 125 280 140 300 C 130 280 128 240 145 215 Z" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
