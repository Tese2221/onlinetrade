<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grapeGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="grapeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="grapeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="grapeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#581c87" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#grapeBg)"/>
  <circle cx="200" cy="210" r="145" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="200" cy="345" rx="85" ry="18" fill="#000000" opacity="0.12"/>

  <g filter="url(#grapeShadow)">
    <!-- Vine & Stem -->
    <path d="M 200 130 C 205 90 220 75 235 70" stroke="#78350f" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 205 105 C 170 80 130 90 120 110 C 145 130 180 125 205 105 Z" fill="url(#grapeLeaf)"/>
    <path d="M 215 95 C 245 75 285 85 295 105 C 270 125 235 120 215 95 Z" fill="url(#grapeLeaf)"/>

    <!-- Cluster of Grapes (Bottom to Top layering) -->
    <!-- Row 5 (Bottom single) -->
    <circle cx="200" cy="315" r="24" fill="url(#grapeGlow)"/>

    <!-- Row 4 (Two grapes) -->
    <circle cx="180" cy="280" r="25" fill="url(#grapeGlow)"/>
    <circle cx="220" cy="280" r="25" fill="url(#grapeGlow)"/>

    <!-- Row 3 (Three grapes) -->
    <circle cx="155" cy="245" r="26" fill="url(#grapeGlow)"/>
    <circle cx="200" cy="245" r="26" fill="url(#grapeGlow)"/>
    <circle cx="245" cy="245" r="26" fill="url(#grapeGlow)"/>

    <!-- Row 2 (Four grapes) -->
    <circle cx="135" cy="205" r="26" fill="url(#grapeGlow)"/>
    <circle cx="178" cy="208" r="26" fill="url(#grapeGlow)"/>
    <circle cx="222" cy="208" r="26" fill="url(#grapeGlow)"/>
    <circle cx="265" cy="205" r="26" fill="url(#grapeGlow)"/>

    <!-- Row 1 (Top grapes) -->
    <circle cx="160" cy="170" r="26" fill="url(#grapeGlow)"/>
    <circle cx="200" cy="165" r="26" fill="url(#grapeGlow)"/>
    <circle cx="240" cy="170" r="26" fill="url(#grapeGlow)"/>

    <!-- Highlights on grapes -->
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="192" cy="308" rx="6" ry="3" transform="rotate(-30 192 308)"/>
      <ellipse cx="172" cy="273" rx="7" ry="4" transform="rotate(-30 172 273)"/>
      <ellipse cx="212" cy="273" rx="7" ry="4" transform="rotate(-30 212 273)"/>
      <ellipse cx="147" cy="238" rx="7" ry="4" transform="rotate(-30 147 238)"/>
      <ellipse cx="192" cy="238" rx="7" ry="4" transform="rotate(-30 192 238)"/>
      <ellipse cx="237" cy="238" rx="7" ry="4" transform="rotate(-30 237 238)"/>
      <ellipse cx="152" cy="163" rx="7" ry="4" transform="rotate(-30 152 163)"/>
      <ellipse cx="192" cy="158" rx="7" ry="4" transform="rotate(-30 192 158)"/>
      <ellipse cx="232" cy="163" rx="7" ry="4" transform="rotate(-30 232 163)"/>
    </g>
  </g>
</svg>
